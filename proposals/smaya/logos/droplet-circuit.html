<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Droplet Circuit · SMAYAA logo option</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
html,body{height:100%;overflow:hidden;background:#FFFFFF}
body{margin:0;cursor:pointer}
.art{position:absolute;left:50%;top:50%;transform-origin:center}
body{margin:0}
.a{animation-duration:calc(10s * var(--k, 1));animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.22,.8,.24,1)}
.draw{stroke-dasharray:1 1;animation-name:draw}
.pop{transform-box:fill-box;transform-origin:center;animation-name:pop}
.rise{animation-name:rise}
.fade{animation-name:fade}
.fillup{animation-name:fillup}
.track{animation-name:track}
.grow{transform-origin:center;animation-name:grow}
.d1{animation-delay:calc(var(--k, 1) * .15s)}.d2{animation-delay:calc(var(--k, 1) * .3s)}.d3{animation-delay:calc(var(--k, 1) * .45s)}.d4{animation-delay:calc(var(--k, 1) * .6s)}.d5{animation-delay:calc(var(--k, 1) * .75s)}.d6{animation-delay:calc(var(--k, 1) * .9s)}.d7{animation-delay:calc(var(--k, 1) * 1.05s)}.d8{animation-delay:calc(var(--k, 1) * 1.2s)}.d9{animation-delay:calc(var(--k, 1) * 1.35s)}.d10{animation-delay:calc(var(--k, 1) * 1.5s)}.d11{animation-delay:calc(var(--k, 1) * 1.65s)}
.flow{animation:flow calc(7s * var(--k, 1)) linear infinite}
.flow2{animation:flow calc(4.6s * var(--k, 1)) linear infinite reverse}
@keyframes draw{0%{stroke-dashoffset:1;opacity:0}1%{opacity:1}12%{stroke-dashoffset:0}72%{stroke-dashoffset:0;opacity:1}80%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:1;opacity:0}}
@keyframes pop{0%{transform:scale(0);opacity:0}9%{transform:scale(1.18);opacity:1}13%{transform:scale(1)}72%{transform:scale(1);opacity:1}80%{transform:scale(.5);opacity:0}100%{transform:scale(0);opacity:0}}
@keyframes rise{0%{opacity:0;transform:translateY(18px)}12%{opacity:1;transform:translateY(0)}72%{opacity:1;transform:translateY(0)}80%{opacity:0;transform:translateY(-8px)}100%{opacity:0;transform:translateY(18px)}}
@keyframes fade{0%{opacity:0}12%{opacity:1}72%{opacity:1}80%{opacity:0}100%{opacity:0}}
@keyframes fillup{0%{transform:translateY(200px)}17%{transform:translateY(0)}72%{transform:translateY(0)}80%{transform:translateY(200px)}100%{transform:translateY(200px)}}
@keyframes track{0%{opacity:0;letter-spacing:.7em}14%{opacity:1;letter-spacing:.42em}72%{opacity:1;letter-spacing:.42em}80%{opacity:0;letter-spacing:.42em}100%{opacity:0;letter-spacing:.7em}}
@keyframes grow{0%{transform:scaleX(0)}12%{transform:scaleX(1)}72%{transform:scaleX(1)}80%{transform:scaleX(0)}100%{transform:scaleX(0)}}
@keyframes flow{to{transform:translateX(-200px)}}
@media (prefers-reduced-motion: reduce){.a,.flow,.flow2{animation:none}}
</style>
</head>
<body>
<div class="art" style="width: 720px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; background: #FFFFFF; --k: 1">
<svg viewBox="0 0 400 400" width="420" height="420" role="img" aria-label="Droplet Circuit mark: a water droplet that fills with flowing water while circuit traces grow inside it">
<defs>
<linearGradient id="ds" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B3A5B"></stop><stop offset="1" stop-color="#12A5B8"></stop></linearGradient>
<clipPath id="dc"><path d="M200 36 C238 96 306 168 306 246 C306 306 258 352 200 352 C142 352 94 306 94 246 C94 168 162 96 200 36 Z"></path></clipPath>
</defs>
<g clip-path="url(#dc)">
<g class="a fillup d1"><g class="flow2"><path d="M-400,196 q50,-14 100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 L800,400 L-400,400 Z" fill="#9BE6EA"></path></g></g>
<g class="a fillup d2"><g class="flow"><path d="M-400,214 q50,-16 100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 L800,400 L-400,400 Z" fill="#12A5B8" opacity="0.8"></path></g></g>
</g>
<g fill="none" stroke="#0B2540" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<path class="a draw d4" d="M200,318 L200,150" pathLength="1"></path>
<path class="a draw d5" d="M200,262 L168,230 L168,196" pathLength="1"></path>
<path class="a draw d5" d="M200,250 L236,214 L236,170" pathLength="1"></path>
<path class="a draw d6" d="M168,230 L140,230" pathLength="1"></path>
<path class="a draw d6" d="M236,214 L262,214" pathLength="1"></path>
</g>
<g fill="#FFFFFF" stroke="#0B2540" stroke-width="3">
<circle class="a pop d4" cx="200" cy="318" r="9"></circle>
<circle class="a pop d6" cx="200" cy="150" r="7"></circle>
<circle class="a pop d7" cx="168" cy="196" r="6"></circle>
<circle class="a pop d7" cx="236" cy="170" r="6"></circle>
<circle class="a pop d8" cx="140" cy="230" r="6"></circle>
<circle class="a pop d8" cx="262" cy="214" r="6"></circle>
</g>
<path class="a draw d6" d="M128,252 C128,214 144,184 162,160" pathLength="1" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.75"></path>
<path class="a draw" d="M200 36 C238 96 306 168 306 246 C306 306 258 352 200 352 C142 352 94 306 94 246 C94 168 162 96 200 36 Z" pathLength="1" fill="none" stroke="url(#ds)" stroke-width="9" stroke-linejoin="round"></path>
</svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 18px">
<div class="a rise d8" style="font-family: Montserrat, sans-serif; font-weight: 700; font-size: 76px; line-height: 1; letter-spacing: 0.01em; color: #0B2540">SMAYAA<span style="color: #0E95A8">.ai</span></div>
<div class="a grow d9" style="width: 64px; height: 3px; background: #12A5B8; border-radius: 2px"></div>
<div class="a track d10" style="font-family: Montserrat, sans-serif; font-weight: 500; font-size: 16px; letter-spacing: 0.42em; color: #3A5A6E">ENGINEERING INTELLIGENCE</div>
</div>
</div>
<script src="logo.js"></script>
</body>
</html>

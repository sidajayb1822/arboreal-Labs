<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Glass Orb · SMAYAA logo option</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
html,body{height:100%;overflow:hidden;background:#FFFFFF}
body{margin:0;cursor:pointer}
.art{position:absolute;left:50%;top:50%;transform-origin:center}
body{margin:0}
.a{animation-duration:calc(10s * var(--k, 1));animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.22,.8,.24,1)}
.draw{stroke-dasharray:1 1;animation-name:draw}
.pop{transform-box:fill-box;transform-origin:center;animation-name:pop}
.zoom{transform-box:view-box;transform-origin:200px 190px;animation-name:pop}
.rise{animation-name:rise}
.fade{animation-name:fade}
.track{animation-name:track}
.grow{transform-origin:center;animation-name:grow}
.d1{animation-delay:calc(var(--k, 1) * .15s)}.d2{animation-delay:calc(var(--k, 1) * .3s)}.d3{animation-delay:calc(var(--k, 1) * .45s)}.d4{animation-delay:calc(var(--k, 1) * .6s)}.d5{animation-delay:calc(var(--k, 1) * .75s)}.d6{animation-delay:calc(var(--k, 1) * .9s)}.d7{animation-delay:calc(var(--k, 1) * 1.05s)}.d8{animation-delay:calc(var(--k, 1) * 1.2s)}.d9{animation-delay:calc(var(--k, 1) * 1.35s)}.d10{animation-delay:calc(var(--k, 1) * 1.5s)}.d11{animation-delay:calc(var(--k, 1) * 1.65s)}
.flow{animation:flow calc(7s * var(--k, 1)) linear infinite}
.flow2{animation:flow calc(4.6s * var(--k, 1)) linear infinite reverse}
.spin,.unspin{transform-box:view-box;transform-origin:0 0}
.spin{animation:spin calc(7s * var(--k, 1)) linear infinite}
.unspin{animation:spin calc(7s * var(--k, 1)) linear infinite reverse}
.shine{animation:shine calc(10s * var(--k, 1)) ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:1;opacity:0}1%{opacity:1}12%{stroke-dashoffset:0}72%{stroke-dashoffset:0;opacity:1}80%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:1;opacity:0}}
@keyframes pop{0%{transform:scale(0);opacity:0}9%{transform:scale(1.12);opacity:1}13%{transform:scale(1)}72%{transform:scale(1);opacity:1}80%{transform:scale(.5);opacity:0}100%{transform:scale(0);opacity:0}}
@keyframes rise{0%{opacity:0;transform:translateY(18px)}12%{opacity:1;transform:translateY(0)}72%{opacity:1;transform:translateY(0)}80%{opacity:0;transform:translateY(-8px)}100%{opacity:0;transform:translateY(18px)}}
@keyframes fade{0%{opacity:0}12%{opacity:1}72%{opacity:1}80%{opacity:0}100%{opacity:0}}
@keyframes track{0%{opacity:0;letter-spacing:.7em}14%{opacity:1;letter-spacing:.42em}72%{opacity:1;letter-spacing:.42em}80%{opacity:0;letter-spacing:.42em}100%{opacity:0;letter-spacing:.7em}}
@keyframes grow{0%{transform:scaleX(0)}12%{transform:scaleX(1)}72%{transform:scaleX(1)}80%{transform:scaleX(0)}100%{transform:scaleX(0)}}
@keyframes flow{to{transform:translateX(-200px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{0%,28%{transform:translateX(-320px)}48%,100%{transform:translateX(320px)}}
@media (prefers-reduced-motion: reduce){.a,.flow,.flow2,.spin,.unspin,.shine{animation:none}}
</style>
</head>
<body>
<div class="art" style="width: 720px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; background: #FFFFFF; --k: 1">
<svg viewBox="0 0 400 400" width="420" height="420" role="img" aria-label="Glass Orb mark: a glossy 3D water sphere with moving water inside and glowing AI nodes orbiting around it">
<defs>
<radialGradient id="orb" cx="0.36" cy="0.3" r="0.8"><stop offset="0" stop-color="#A5FBFF"></stop><stop offset="0.3" stop-color="#2EE0FF"></stop><stop offset="0.65" stop-color="#0090F0"></stop><stop offset="1" stop-color="#0436B8"></stop></radialGradient>
<linearGradient id="wb1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00F5D4"></stop><stop offset="1" stop-color="#00B4FF"></stop></linearGradient>
<linearGradient id="wb2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00D0FF"></stop><stop offset="1" stop-color="#0040D8"></stop></linearGradient>
<radialGradient id="vol" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#01205F" stop-opacity="0"></stop><stop offset="0.72" stop-color="#01205F" stop-opacity="0"></stop><stop offset="1" stop-color="#01205F" stop-opacity="0.55"></stop></radialGradient>
<linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"></stop><stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"></stop><stop offset="0.8" stop-color="#7FF6FF" stop-opacity="0"></stop><stop offset="1" stop-color="#7FF6FF" stop-opacity="0.8"></stop></linearGradient>
<radialGradient id="spec" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"></stop><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop></radialGradient>
<radialGradient id="gn" cx="0.35" cy="0.3" r="0.75"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="0.35" stop-color="#6CF4FF"></stop><stop offset="0.75" stop-color="#0088FF"></stop><stop offset="1" stop-color="#0035B0"></stop></radialGradient>
<radialGradient id="shd" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#0A2A6E" stop-opacity="0.45"></stop><stop offset="1" stop-color="#0A2A6E" stop-opacity="0"></stop></radialGradient>
<clipPath id="oc"><circle cx="200" cy="190" r="140"></circle></clipPath>
<clipPath id="back"><rect x="-260" y="-260" width="520" height="260"></rect></clipPath>
<clipPath id="front"><rect x="-260" y="0" width="520" height="260"></rect></clipPath>
</defs>
<ellipse class="a fade d1" cx="200" cy="362" rx="118" ry="15" fill="url(#shd)"></ellipse>
<g transform="translate(200 190) rotate(-14)" clip-path="url(#back)">
<g transform="scale(1 0.26)">
<circle class="a draw d2" r="178" fill="none" stroke="#5CF0FF" stroke-width="2.5" vector-effect="non-scaling-stroke" pathLength="1" opacity="0.6"></circle>
<g class="a fade d4">
<g class="spin"><g transform="translate(178 0)"><g class="unspin"><g transform="scale(1 3.846)"><circle r="10" fill="url(#gn)"></circle></g></g></g></g>
<g class="spin" style="animation-delay: calc(var(--k, 1) * -2.333s)"><g transform="translate(178 0)"><g class="unspin" style="animation-delay: calc(var(--k, 1) * -2.333s)"><g transform="scale(1 3.846)"><circle r="7" fill="url(#gn)"></circle></g></g></g></g>
<g class="spin" style="animation-delay: calc(var(--k, 1) * -4.667s)"><g transform="translate(178 0)"><g class="unspin" style="animation-delay: calc(var(--k, 1) * -4.667s)"><g transform="scale(1 3.846)"><circle r="12" fill="url(#gn)"></circle></g></g></g></g>
</g>
</g>
</g>
<g class="a zoom">
<circle cx="200" cy="190" r="140" fill="url(#orb)"></circle>
<g clip-path="url(#oc)">
<g class="flow2"><path d="M-400,198 q50,-18 100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 L800,400 L-400,400 Z" fill="url(#wb1)" opacity="0.85"></path></g>
<g class="flow"><path d="M-400,218 q50,-14 100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 L800,400 L-400,400 Z" fill="url(#wb2)" opacity="0.9"></path></g>
</g>
<circle cx="200" cy="190" r="140" fill="url(#vol)"></circle>
<circle cx="200" cy="190" r="138.5" fill="none" stroke="url(#rim)" stroke-width="3"></circle>
<ellipse cx="148" cy="118" rx="56" ry="30" transform="rotate(-32 148 118)" fill="url(#spec)"></ellipse>
<circle cx="262" cy="258" r="7" fill="#FFFFFF" opacity="0.55"></circle>
<g clip-path="url(#oc)"><g transform="rotate(22 200 190)"><rect class="shine" x="180" y="-40" width="34" height="480" fill="#FFFFFF" opacity="0.22"></rect></g></g>
</g>
<g transform="translate(200 190) rotate(-14)" clip-path="url(#front)">
<g transform="scale(1 0.26)">
<circle class="a draw d2" r="178" fill="none" stroke="#5CF0FF" stroke-width="3" vector-effect="non-scaling-stroke" pathLength="1"></circle>
<g class="a fade d4">
<g class="spin"><g transform="translate(178 0)"><g class="unspin"><g transform="scale(1 3.846)"><circle r="10" fill="url(#gn)"></circle></g></g></g></g>
<g class="spin" style="animation-delay: calc(var(--k, 1) * -2.333s)"><g transform="translate(178 0)"><g class="unspin" style="animation-delay: calc(var(--k, 1) * -2.333s)"><g transform="scale(1 3.846)"><circle r="7" fill="url(#gn)"></circle></g></g></g></g>
<g class="spin" style="animation-delay: calc(var(--k, 1) * -4.667s)"><g transform="translate(178 0)"><g class="unspin" style="animation-delay: calc(var(--k, 1) * -4.667s)"><g transform="scale(1 3.846)"><circle r="12" fill="url(#gn)"></circle></g></g></g></g>
</g>
</g>
</g>
</svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 18px">
<div class="a rise d8" style="font-family: Montserrat, sans-serif; font-weight: 800; font-size: 76px; line-height: 1; letter-spacing: 0.01em; color: #021A4A">SMAYAA<span style="background: linear-gradient(90deg, #00A8FF, #00D9C0); -webkit-background-clip: text; background-clip: text; color: transparent">.ai</span></div>
<div class="a grow d9" style="width: 64px; height: 3px; background: linear-gradient(90deg, #00A8FF, #00E0C0); border-radius: 2px"></div>
<div class="a track d10" style="font-family: Montserrat, sans-serif; font-weight: 500; font-size: 16px; letter-spacing: 0.42em; color: #24426E">ENGINEERING INTELLIGENCE</div>
</div>
</div>
<script src="logo.js"></script>
</body>
</html>

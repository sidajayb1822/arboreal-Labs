<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Iso Chip and Drop · SMAYAA logo option</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&amp;display=swap" rel="stylesheet">
<style>
html,body{height:100%;overflow:hidden;background:#FFFFFF}
body{margin:0;cursor:pointer}
.art{position:absolute;left:50%;top:50%;transform-origin:center}
body{margin:0}
.a{animation-duration:calc(10s * var(--k, 1));animation-iteration-count:infinite;animation-fill-mode:both;animation-timing-function:cubic-bezier(.22,.8,.24,1)}
.draw{stroke-dasharray:1 1;animation-name:draw}
.pop{transform-box:fill-box;transform-origin:center;animation-name:pop}
.rise{animation-name:rise}
.fade{animation-name:fade}
.slide{animation-name:slide}
.track{animation-name:track}
.grow{transform-origin:center;animation-name:grow}
.d1{animation-delay:calc(var(--k, 1) * .15s)}.d2{animation-delay:calc(var(--k, 1) * .3s)}.d3{animation-delay:calc(var(--k, 1) * .45s)}.d4{animation-delay:calc(var(--k, 1) * .6s)}.d5{animation-delay:calc(var(--k, 1) * .75s)}.d6{animation-delay:calc(var(--k, 1) * .9s)}.d7{animation-delay:calc(var(--k, 1) * 1.05s)}.d8{animation-delay:calc(var(--k, 1) * 1.2s)}.d9{animation-delay:calc(var(--k, 1) * 1.35s)}.d10{animation-delay:calc(var(--k, 1) * 1.5s)}.d11{animation-delay:calc(var(--k, 1) * 1.65s)}
.float{animation:float calc(3.4s * var(--k, 1)) ease-in-out infinite}
.stream{stroke-dasharray:2 10;animation:stream calc(1.2s * var(--k, 1)) linear infinite}
.rip{transform-box:view-box;transform-origin:200px 202px;animation:ripple calc(2.8s * var(--k, 1)) ease-out infinite}
.rip2{transform-box:view-box;transform-origin:200px 202px;animation:ripple calc(2.8s * var(--k, 1)) ease-out infinite;animation-delay:calc(var(--k, 1) * -1.4s)}
@keyframes draw{0%{stroke-dashoffset:1;opacity:0}1%{opacity:1}12%{stroke-dashoffset:0}72%{stroke-dashoffset:0;opacity:1}80%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:1;opacity:0}}
@keyframes pop{0%{transform:scale(0);opacity:0}9%{transform:scale(1.18);opacity:1}13%{transform:scale(1)}72%{transform:scale(1);opacity:1}80%{transform:scale(.5);opacity:0}100%{transform:scale(0);opacity:0}}
@keyframes rise{0%{opacity:0;transform:translateY(18px)}12%{opacity:1;transform:translateY(0)}72%{opacity:1;transform:translateY(0)}80%{opacity:0;transform:translateY(-8px)}100%{opacity:0;transform:translateY(18px)}}
@keyframes fade{0%{opacity:0}12%{opacity:1}72%{opacity:1}80%{opacity:0}100%{opacity:0}}
@keyframes slide{0%{opacity:0;transform:translate(var(--tx, 0px), var(--ty, 0px))}12%{opacity:1;transform:translate(0px, 0px)}72%{opacity:1;transform:translate(0px, 0px)}80%{opacity:0;transform:translate(0px, 0px)}100%{opacity:0;transform:translate(var(--tx, 0px), var(--ty, 0px))}}
@keyframes track{0%{opacity:0;letter-spacing:.7em}14%{opacity:1;letter-spacing:.42em}72%{opacity:1;letter-spacing:.42em}80%{opacity:0;letter-spacing:.42em}100%{opacity:0;letter-spacing:.7em}}
@keyframes grow{0%{transform:scaleX(0)}12%{transform:scaleX(1)}72%{transform:scaleX(1)}80%{transform:scaleX(0)}100%{transform:scaleX(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes stream{to{stroke-dashoffset:-12}}
@keyframes ripple{0%{transform:scale(.1);opacity:.9}100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion: reduce){.a,.float,.stream,.rip,.rip2{animation:none}}
</style>
</head>
<body>
<div class="art" style="width: 720px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; background: #FFFFFF; --k: 1">

<radialGradient id="dg" cx="0.35" cy="0.55" r="0.7"><stop offset="0" stop-color="#C8FEFF"></stop><stop offset="0.45" stop-color="#00C8FF"></stop><stop offset="1" stop-color="#0050E0"></stop></radialGradient>

<radialGradient id="shd" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#0A2A6E" stop-opacity="0.4"></stop><stop offset="1" stop-color="#0A2A6E" stop-opacity="0"></stop></radialGradient>

</defs>
<ellipse class="a fade" cx="200" cy="342" rx="128" ry="22" fill="url(#shd)"></ellipse>
<polygon class="a slide d1" style="--tx: -40px; --ty: 24px" points="110,202 200,254 200,324 110,272" fill="url(#fl)"></polygon>
<polygon class="a slide d2" style="--tx: 40px; --ty: 24px" points="200,254 290,202 290,272 200,324" fill="url(#fr)"></polygon>

</g>

<line class="a draw d6" x1="182" y1="278.6" x2="163" y2="289.6" pathLength="1"></line>
<line class="a draw d6" x1="218" y1="278.6" x2="237" y2="289.6" pathLength="1"></line>
<line class="a draw d6" x1="236" y1="268.2" x2="255" y2="279.2" pathLength="1"></line>
<line class="a draw d6" x1="254" y1="257.8" x2="273" y2="268.8" pathLength="1"></line>
<line class="a draw d6" x1="272" y1="247.4" x2="291" y2="258.4" pathLength="1"></line>
</g>
<g fill="url(#gn)">
<circle class="a pop d7" cx="109" cy="258.4" r="5"></circle>
<circle class="a pop d7" cx="127" cy="268.8" r="5"></circle>
<circle class="a pop d7" cx="145" cy="279.2" r="5"></circle>
<circle class="a pop d7" cx="163" cy="289.6" r="5"></circle>
<circle class="a pop d8" cx="237" cy="289.6" r="5"></circle>

<circle class="a pop d8" cx="291" cy="258.4" r="5"></circle>
</g>
<g class="a fade d7"><line class="stream" x1="200" y1="150" x2="200" y2="198" stroke="#00D4FF" stroke-width="4" stroke-linecap="round"></line></g>
<g class="a slide d5" style="--tx: 0px; --ty: -90px">
<g class="float">
<path d="M200,52 C214,74 232,92 232,112 A32,32 0 0 1 168,112 C168,92 186,74 200,52 Z" fill="url(#dg)"></path>
<ellipse cx="187" cy="106" rx="6" ry="11" transform="rotate(20 187 106)" fill="#FFFFFF" opacity="0.75"></ellipse>
<circle cx="219" cy="124" r="3" fill="#FFFFFF" opacity="0.6"></circle>
</g>
</g>
</svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 18px">
<div class="a rise d8" style="font-family: Montserrat, sans-serif; font-weight: 800; font-size: 76px; line-height: 1; letter-spacing: 0.01em; color: #021A4A">SMAYAA<span style="background: linear-gradient(90deg, #00A8FF, #00D9C0); -webkit-background-clip: text; background-clip: text; color: transparent">.ai</span></div>
<div class="a grow d9" style="width: 64px; height: 3px; background: linear-gradient(90deg, #00A8FF, #00E0C0); border-radius: 2px"></div>
<div class="a track d10" style="font-family: Montserrat, sans-serif; font-weight: 500; font-size: 16px; letter-spacing: 0.42em; color: #24426E">ENGINEERING INTELLIGENCE</div>

</div>

</html>
